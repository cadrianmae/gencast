[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gencast"
version = "1.2.3"
description = "Generate conversational podcasts from documents using AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mae Capacite", email = "cadrianmae@users.noreply.github.com"}
]
keywords = ["podcast", "ai", "tts", "openai", "anthropic", "notebooklm", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "litellm>=1.30.0",
    "openai>=1.0.0",
    "pydub>=0.25.1",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "httpx>=0.25.0",
    "mistralai>=1.0.0",
    "pypdf>=3.0.0",
    "audioop-lts>=0.2.0; python_version >= '3.13'",
    "rich>=13.0.0",
    "srt>=3.5.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "vcrpy>=5.0.0",
    "ffmpeg-python>=0.2.0",
]
dev = [
    "basedpyright>=1.21.0",
    "ruff>=0.1.0",
]
all = ["gencast[test,dev]"]

[project.scripts]
gencast = "gencast.cli.main:cli"

[project.urls]
Homepage = "https://github.com/cadrianmae/podcast-ai"
Repository = "https://github.com/cadrianmae/podcast-ai"
Issues = "https://github.com/cadrianmae/podcast-ai/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gencast*"]

[tool.setuptools.package-data]
"gencast.profiles.bundled" = ["**/*.yaml"]
"gencast.prompts" = ["*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "benchmark: wall-clock performance check (skip by default; run with -m benchmark)",
]
addopts = "-m 'not benchmark'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "N", "W"]

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
include = ["gencast", "tests"]
exclude = ["venv", "build", "**/__pycache__", "scratch"]
